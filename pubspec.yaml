name: massive_arms
description: "Massive Arms and Shoulders — acompanhamento de treino offline."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.6.0
  intl: ^0.20.3
  fl_chart: ^1.2.0
  collection: ^1.19.1
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  google_sign_in: ^7.2.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: assets/branding/app_icon.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/branding/app_icon.png
    background_color: "#0A0A0A"
    theme_color: "#7C3AED"
  windows:
    generate: true
    image_path: assets/branding/app_icon.png
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png
